name: FDGCast Windows alpha test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-alpha.yml'
      - 'scripts/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded source archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-m1 --repo "${{ github.repository }}" --pattern "FDGCast-Windows-M1-source.zip" --dir .
          if (!(Test-Path "FDGCast-Windows-M1-source.zip")) { throw "Upload the source ZIP to release source-m1 first." }
          Expand-Archive "FDGCast-Windows-M1-source.zip" -DestinationPath source -Force
          if (!(Test-Path "source/FDGCast-source/CMakeLists.txt")) { throw "Expected source/FDGCast-source/CMakeLists.txt not found." }
      - name: Restore missing OBS source submodules
        shell: pwsh
        working-directory: source/FDGCast-source
        run: |
          $modules = @{
            "deps/libdshowcapture/src" = "https://github.com/obsproject/libdshowcapture.git"
            "plugins/obs-browser" = "https://github.com/obsproject/obs-browser.git"
            "plugins/obs-websocket" = "https://github.com/obsproject/obs-websocket.git"
          }
          foreach ($path in $modules.Keys) {
            if (!(Test-Path "$path/CMakeLists.txt") -and !(Test-Path "$path/dshowcapture.hpp")) {
              git clone --depth 1 $modules[$path] $path
              if ($LASTEXITCODE -ne 0) { throw "Unable to restore $path" }
            }
          }
          foreach ($path in $modules.Keys) {
            if (Test-Path "$path/.git") {
              git -C $path submodule update --init --recursive --depth 1
              if ($LASTEXITCODE -ne 0) { throw "Nested submodule restore failed for $path" }
            }
          }
          if (!(Test-Path "deps/libdshowcapture/src/external/capture-device-support/Library/EGAVResult.cpp")) {
            throw "DirectShow capture-device-support sources still missing after recursive submodule update"
          }
      - name: Apply FDGCast Studio navigation to OBS source
        shell: pwsh
        run: |
          python scripts/apply-fdgcast-navigation.py source/FDGCast-source
          if ($LASTEXITCODE -ne 0) { throw "FDGCast navigation source patch failed" }
      - name: Check toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
      - name: Configure Windows build
        shell: pwsh
        working-directory: source/FDGCast-source
        run: cmake --preset windows-x64
      - name: Build Windows alpha
        shell: pwsh
        working-directory: source/FDGCast-source
        run: cmake --build --preset windows-x64
      - name: Package portable Windows alpha
        shell: pwsh
        working-directory: source/FDGCast-source
        run: |
          $runDir = "build_x64/rundir"
          $exe = Get-ChildItem -Path $runDir -Filter obs64.exe -File -Recurse | Where-Object { $_.FullName -match '[\\/]bin[\\/]64bit[\\/]' } | Select-Object -First 1
          if (!$exe) { throw "Built obs64.exe not found in runtime output; cannot package." }
          $runtimeRoot = $exe.Directory.Parent.Parent.FullName
          if (!(Test-Path (Join-Path $runtimeRoot "data"))) { throw "Runtime data directory missing: $runtimeRoot" }
          $package = Join-Path (Get-Location) "FDGCast-Studio-Windows-Alpha"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item (Join-Path $runtimeRoot "*") $package -Recurse -Force
          $launch = Join-Path $package "Launch-FDGCast-Studio.bat"
          Set-Content -Path $launch -Encoding ascii -Value '@echo off', 'cd /d "%~dp0bin\\64bit"', 'start "" "obs64.exe"'
          Set-Content -Path (Join-Path $package "README-FIRST.txt") -Value "FDGCast Studio experimental Windows alpha. This is currently an OBS-based development build, not a finished rebranded application. Run Launch-FDGCast-Studio.bat. Keep the entire folder together. No installer is included. OBS GPL license and attribution are retained in the source project."
          Compress-Archive -Path $package -DestinationPath "FDGCast-Studio-Windows-Alpha.zip" -Force
          Write-Host "Portable alpha packaged from $runtimeRoot"
      - name: Upload portable Windows alpha
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-Studio-Windows-Alpha
          path: source/FDGCast-source/FDGCast-Studio-Windows-Alpha.zip
          if-no-files-found: error
          retention-days: 30
      - name: Build Windows setup executable
        shell: pwsh
        working-directory: source/FDGCast-source
        run: |
          $package = (Resolve-Path "FDGCast-Studio-Windows-Alpha").Path
          $output = Join-Path (Get-Location) "installer-output"
          New-Item -ItemType Directory -Force $output | Out-Null
          $license = Get-ChildItem -Path . -File -Include COPYING,LICENSE,LICENSE.txt -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '[\\/]build_x(64|86)[\\/]' } | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName (Join-Path $package "SOURCE-LICENSE.txt") -Force }
          $iscc = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "${env:ProgramFiles}\\Inno Setup 6\\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $iscc = @(
              "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
              "${env:ProgramFiles}\\Inno Setup 6\\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (!$iscc) { throw "Inno Setup compiler ISCC.exe not found" }
          $iss = @'
          [Setup]
          AppId={{FDF7C8A4-80CD-4F6A-AD94-9C73F07B45D1}
          AppName=FDGCast Studio
          AppVersion=0.1.0
          AppPublisher=Forged Destiny Gaming
          DefaultDirName={autopf}\\FDGCast Studio
          DefaultGroupName=FDGCast Studio
          OutputDir=installer-output
          OutputBaseFilename=FDGCast-Studio-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\\bin\\64bit\\obs64.exe
          [Files]
          Source: "FDGCast-Studio-Windows-Alpha\\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion
          [Icons]
          Name: "{group}\\FDGCast Studio"; Filename: "{app}\\bin\\64bit\\obs64.exe"; WorkingDir: "{app}\\bin\\64bit"
          Name: "{autodesktop}\\FDGCast Studio"; Filename: "{app}\\bin\\64bit\\obs64.exe"; WorkingDir: "{app}\\bin\\64bit"; Tasks: desktopicon
          [Tasks]
          Name: desktopicon; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"
          [Run]
          Filename: "{app}\\bin\\64bit\\obs64.exe"; WorkingDir: "{app}\\bin\\64bit"; Description: "Launch FDGCast Studio"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path "FDGCast-Studio-Installer.iss" -Value $iss -Encoding utf8
          & $iscc "FDGCast-Studio-Installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (!(Test-Path "installer-output/FDGCast-Studio-Setup.exe")) { throw "Setup executable not created" }
          Get-FileHash "installer-output/FDGCast-Studio-Setup.exe" -Algorithm SHA256 | Format-List
      - name: Upload Windows setup executable
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-Studio-Setup-Windows-x64
          path: source/FDGCast-source/installer-output/FDGCast-Studio-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source/FDGCast-source
        run: |
          $tag = "v0.1.0-alpha.$env:GITHUB_RUN_NUMBER"
          $installer = "installer-output/FDGCast-Studio-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer missing; cannot publish pre-release." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @"
          ## FDGCast Studio Windows Alpha
          Experimental Windows x64 installer based on OBS Studio.
          
          **This is a pre-release for testing, not a complete source-level rebrand.**
          The installer and shortcuts use FDGCast Studio branding, but the application executable remains obs64.exe and the OBS UI and settings may still be present. Companion features are not yet integrated.
          
          ### Installation
          Download FDGCast-Studio-Setup.exe, run it, and use the FDGCast Studio shortcut.
          
          ### SHA-256
          \`$hash\`
          
          ### Open-source attribution
          Based on OBS Studio; upstream licenses and corresponding source obligations apply. Source archive used for this build is available in the repository's source-m1 release.
          "@
          gh release create $tag $installer --repo "$env:GITHUB_REPOSITORY" --title "FDGCast Studio $tag (Pre-release)" --notes $notes --prerelease --target "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "GitHub pre-release publication failed" }
      - name: Upload diagnostic logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-alpha-build-diagnostics
          path: |
            source/FDGCast-source/build_x64/CMakeFiles/CMakeConfigureLog.yaml
            source/FDGCast-source/build_x64/rundir/
          if-no-files-found: warn
