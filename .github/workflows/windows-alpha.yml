name: FDGCast Windows alpha test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Download uploaded source archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download source-m1 --repo "${{ github.repository }}" --pattern "FDGCast-Windows-M1-source.zip" --dir .
          if (!(Test-Path "FDGCast-Windows-M1-source.zip")) { throw "Upload the source ZIP to release source-m1 first." }
          Expand-Archive "FDGCast-Windows-M1-source.zip" -DestinationPath source -Force
          if (!(Test-Path "source/FDGCast-source/CMakeLists.txt")) { throw "Expected source/FDGCast-source/CMakeLists.txt not found." }
      - name: Restore missing OBS source submodules
        shell: pwsh
        working-directory: source/FDGCast-source
        run: |
          $modules = @{
            "deps/libdshowcapture/src" = "https://github.com/obsproject/libdshowcapture.git"
            "plugins/obs-browser" = "https://github.com/obsproject/obs-browser.git"
            "plugins/obs-websocket" = "https://github.com/obsproject/obs-websocket.git"
          }
          foreach ($path in $modules.Keys) {
            if (!(Test-Path "$path/CMakeLists.txt") -and !(Test-Path "$path/dshowcapture.hpp")) {
              git clone --depth 1 $modules[$path] $path
              if ($LASTEXITCODE -ne 0) { throw "Unable to restore $path" }
            }
          }
          foreach ($path in $modules.Keys) {
            if (Test-Path "$path/.git") {
              git -C $path submodule update --init --recursive --depth 1
              if ($LASTEXITCODE -ne 0) { throw "Nested submodule restore failed for $path" }
            }
          }
          if (!(Test-Path "deps/libdshowcapture/src/external/capture-device-support/Library/EGAVResult.cpp")) {
            throw "DirectShow capture-device-support sources still missing after recursive submodule update"
          }
      - name: Check toolchain
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
      - name: Configure Windows build
        shell: pwsh
        working-directory: source/FDGCast-source
        run: cmake --preset windows-x64
      - name: Build Windows alpha
        shell: pwsh
        working-directory: source/FDGCast-source
        run: cmake --build --preset windows-x64
      - name: Package portable Windows alpha
        shell: pwsh
        working-directory: source/FDGCast-source
        run: |
          $runDir = "build_x64/rundir"
          $exe = Get-ChildItem -Path $runDir -Filter obs64.exe -File -Recurse | Where-Object { $_.FullName -match '[\\/]bin[\\/]64bit[\\/]' } | Select-Object -First 1
          if (!$exe) { throw "Built obs64.exe not found in runtime output; cannot package." }
          $runtimeRoot = $exe.Directory.Parent.Parent.FullName
          if (!(Test-Path (Join-Path $runtimeRoot "data"))) { throw "Runtime data directory missing: $runtimeRoot" }
          $package = Join-Path (Get-Location) "FDGCast-Studio-Windows-Alpha"
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item (Join-Path $runtimeRoot "*") $package -Recurse -Force
          $launch = Join-Path $package "Launch-FDGCast-Studio.bat"
          Set-Content -Path $launch -Encoding ascii -Value '@echo off', 'cd /d "%~dp0bin\\64bit"', 'start "" "obs64.exe"'
          Set-Content -Path (Join-Path $package "README-FIRST.txt") -Value "FDGCast Studio experimental Windows alpha. This is currently an OBS-based development build, not a finished rebranded application. Run Launch-FDGCast-Studio.bat. Keep the entire folder together. No installer is included. OBS GPL license and attribution are retained in the source project."
          Compress-Archive -Path $package -DestinationPath "FDGCast-Studio-Windows-Alpha.zip" -Force
          Write-Host "Portable alpha packaged from $runtimeRoot"
      - name: Upload portable Windows alpha
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-Studio-Windows-Alpha
          path: source/FDGCast-source/FDGCast-Studio-Windows-Alpha.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic logs and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FDGCast-alpha-build-diagnostics
          path: |
            source/FDGCast-source/build_x64/CMakeFiles/CMakeConfigureLog.yaml
            source/FDGCast-source/build_x64/rundir/
          if-no-files-found: warn
